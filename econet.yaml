- platform: rest
  name: room_thermostat_mode
  resource: http://[IP]/econet/regParams
  authentication: basic
  username: !secret econet_username
  password: !secret econet_password
  value_template: '{{ value_json["curr"]["ecoSterMode1"] }}'
  scan_interval: 10
  headers:
    User-Agent: Mozilla/5.0
    Content-Type: application/json

- platform: template
  sensors:
    room_thermostat_mode_name:
      friendly_name: "Tryb pracy termostatu pokojowego"
      # entity_id: sensor.room_thermostat_mode
      value_template: >-
        {% if is_state('sensor.room_thermostat_mode', '0') %}
        Tryb harmonogram
        {% elif is_state('sensor.room_thermostat_mode','1') %}
        Noc
        {% elif is_state('sensor.room_thermostat_mode','2') %}
        Dzień
        {% elif is_state('sensor.room_thermostat_mode','3') %}
        Tryb wyłączony
        {% elif is_state('sensor.room_thermostat_mode','4') %}
        Tryb wietrzenie
        {% elif is_state('sensor.room_thermostat_mode','5') %}
        Grzej teraz
        {% elif is_state('sensor.room_thermostat_mode','6') %}
        Tryb wakacje
        {% elif is_state('sensor.room_thermostat_mode','7') %}
        Tryb przeciwzamrożeniowy
        {% elif is_state('sensor.room_thermostat_mode','133') %}
        Tryb grzej teraz
        {% else %}
        Nieznany
        {% endif %}