#
# Econet
#
- platform: rest
  name: mode
  resource: http://[IP]/econet/regParams
  authentication: basic
  username: !secret econet_username
  password: !secret econet_password
  value_template: '{{ value_json["curr"]["mode"] }}'
  scan_interval: 10
  headers:
    User-Agent: Mozilla/5.0
    Content-Type: application/json

- platform: template
  sensors:
    tryb_pracy_pieca:
      friendly_name: "Tryb"
      value_template: >-
        {% if is_state('sensor.mode', '0') %}
        Wyłączony
        {% elif is_state('sensor.mode','2') %}
        Rozpalanie
        {% elif is_state('sensor.mode','3') %}
        Praca
        {% elif is_state('sensor.mode','5') %}
        Postój
        {% elif is_state('sensor.mode','6') %}
        Czyszczenie
        {% elif is_state('sensor.mode','7') %}
        Wygaszanie
        {% elif is_state('sensor.mode','23') %}
        Rozżarzanie
        {% else %}
        Nieznany
        {% endif %}

